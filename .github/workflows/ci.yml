name: CI

on:
  push:
    branches: [main, japanese]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Only the newest run per branch matters; cancel older ones still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. The publish job widens this for itself.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Runs in the same image the app ships in, so a dependency that is
      # missing from the runtime fails here rather than in production.
      - name: Run pytest
        run: docker compose --profile test run --rm --build test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  stack:
    name: Stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The definition of done for this repo is that a clean clone comes up
      # with no manual steps, so CI asserts exactly that.
      - name: docker compose up
        run: docker compose up --build --detach --wait --wait-timeout 240

      - name: Backend is healthy and reached DynamoDB
        run: |
          curl --fail --silent --show-error http://localhost:8000/health \
            | tee /dev/stderr | grep -q '"dynamodb":"ok"'

      - name: Tables were created
        run: docker compose logs dynamodb-init | grep -qE "is ACTIVE|already exists"

      - name: Create a profile and log a set end to end
        run: |
          set -euo pipefail

          profile=$(curl --fail --silent -X POST http://localhost:8000/api/profiles \
            -H 'Content-Type: application/json' -d '{"name":"ci"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object_id"])')

          workout=$(curl --fail --silent -X POST http://localhost:8000/api/workouts \
            -H 'Content-Type: application/json' -H "X-Profile-Id: $profile" \
            -d '{"workout_date":"2026-01-01","title":"ci","notes":""}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object_id"])')

          # 80.1 is the weight that used to fail: Decimal(80.1) overruns
          # DynamoDB's precision limit.
          curl --fail --silent -X POST http://localhost:8000/api/sets \
            -H 'Content-Type: application/json' -H "X-Profile-Id: $profile" \
            -d '{"set_type":"working","weight":80.1,"unit":"kg","reps":5,
                 "notes":"","exercise_join_id":"00000000-0000-0000-0000-000000000001"}' \
            > /dev/null

          curl --fail --silent -H "X-Profile-Id: $profile" \
            "http://localhost:8000/api/workouts/$workout/detail" > /dev/null

          # Same fractional weight, through the body weight log.
          curl --fail --silent -X POST http://localhost:8000/api/body-weights \
            -H 'Content-Type: application/json' -H "X-Profile-Id: $profile" \
            -d '{"entry_date":"2026-01-01","weight":80.1,"notes":""}' \
            > /dev/null

          echo "profile=$profile" >> "$GITHUB_ENV"

      - name: Data survives a restart
        run: |
          set -euo pipefail
          docker compose down
          docker compose up --detach --wait --wait-timeout 240

          curl --fail --silent -H "X-Profile-Id: ${profile}" \
            http://localhost:8000/api/workouts \
            | python3 -c 'import json,sys; assert len(json.load(sys.stdin)) == 1, "data did not persist"'

          curl --fail --silent -H "X-Profile-Id: ${profile}" \
            http://localhost:8000/api/body-weights \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)[0]["weight"] == 80.1, "weigh-in did not persist"'

      - name: The frontend serves its pages
        run: |
          set -euo pipefail
          for path in / /profiles /workouts /exercises /body-weight; do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --cookie "profileId=${profile}" "http://localhost:3000${path}")
            echo "$path -> $code"
            [ "$code" = "200" ]
          done

      # The theme has to be in the first byte the server sends, or a dark
      # profile paints white before the JS runs. Asserting on the markup is
      # the only way to catch that regressing.
      # The home page's summary reads the weigh-ins, and its button posts a
      # workout dated today. A 200 alone would not catch either breaking.
      - name: The home page shows the weight summary
        run: |
          set -euo pipefail

          curl --fail --silent --cookie "profileId=${profile}" http://localhost:3000/ \
            | grep -q 'Progress'

          # Apostrophe-free on purpose: Svelte renders it as &#39;.
          curl --fail --silent --cookie "profileId=${profile}" http://localhost:3000/ \
            | grep -q 'Start today'

      # Exercises carry their tags joined on, which is what both tag filters
      # read. A regression here shows up as filters that match nothing.
      - name: Exercises come back with their tags
        run: |
          set -euo pipefail

          tag=$(curl --fail --silent -X POST http://localhost:8000/api/tags \
            -H 'Content-Type: application/json' -H "X-Profile-Id: ${profile}" \
            -d '{"name":"Push","color_hex":"#e11d48"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object_id"])')

          exercise=$(curl --fail --silent -X POST http://localhost:8000/api/exercises \
            -H 'Content-Type: application/json' -H "X-Profile-Id: ${profile}" \
            -d '{"name":"Bench","description":""}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["object_id"])')

          curl --fail --silent -X POST http://localhost:8000/api/tag-joins \
            -H 'Content-Type: application/json' -H "X-Profile-Id: ${profile}" \
            -d "{\"target_id\":\"${exercise}\",\"tag_id\":\"${tag}\"}" > /dev/null

          curl --fail --silent -H "X-Profile-Id: ${profile}" \
            http://localhost:8000/api/exercises \
            | python3 -c 'import json,sys; e=[x for x in json.load(sys.stdin) if x["name"]=="Bench"][0]; assert [t["name"] for t in e["tags"]] == ["Push"], e'

          # Untagging is keyed by the pair, not the join id.
          curl --fail --silent -X DELETE \
            "http://localhost:8000/api/tag-joins?target=${exercise}&tag=${tag}" \
            -H "X-Profile-Id: ${profile}" > /dev/null

          curl --fail --silent -H "X-Profile-Id: ${profile}" \
            http://localhost:8000/api/exercises \
            | python3 -c 'import json,sys; e=[x for x in json.load(sys.stdin) if x["name"]=="Bench"][0]; assert e["tags"] == [], e'

      - name: The theme is server-rendered
        run: |
          set -euo pipefail

          curl --silent --cookie "profileId=${profile}; theme=dark" \
            http://localhost:3000/ | grep -q '<html lang="en" class="dark">'

          curl --silent --cookie "profileId=${profile}" \
            http://localhost:3000/ | grep -q '<html lang="en" class="">'

      - name: Toggling the theme stores it on the profile
        run: |
          set -euo pipefail

          # The toggle's own path: the frontend endpoint, which updates the
          # profile, drops its cached copy and re-sets the cookie.
          curl --fail --silent -X PUT http://localhost:3000/api/theme \
            -H 'Content-Type: application/json' --cookie "profileId=${profile}" \
            -d '{"darkMode":true}' | grep -q '"darkMode":true'

          curl --fail --silent "http://localhost:8000/api/profiles/${profile}" \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["dark_mode"] is True, "not stored on the profile"'

          curl --fail --silent -X PUT http://localhost:3000/api/theme \
            -H 'Content-Type: application/json' --cookie "profileId=${profile}" \
            -d '{"darkMode":false}' | grep -q '"darkMode":false'

          # A non-boolean is refused, and without a profile there is nothing
          # to store it on.
          [ "$(curl --silent -o /dev/null -w '%{http_code}' -X PUT http://localhost:3000/api/theme \
            -H 'Content-Type: application/json' --cookie "profileId=${profile}" -d '{"darkMode":"yes"}')" = "400" ]
          [ "$(curl --silent -o /dev/null -w '%{http_code}' -X PUT http://localhost:3000/api/theme \
            -H 'Content-Type: application/json' -d '{"darkMode":true}')" = "401" ]

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down --volumes

  publish:
    name: Publish images
    # Nothing ships unless all three gates are green.
    needs: [backend, frontend, stack]
    # Pull requests run the gates but never publish. `on.push` already
    # restricts this to main, japanese and v* tags, so a push is enough.
    # metadata-action gives `latest` only to the default branch.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            target: base
          - service: frontend
            context: ./frontend
            target: production

    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase in image names, and a repository name may
      # contain it. `tr` rather than bash's ${v,,} so this does not depend on
      # the runner's bash version.
      - name: Resolve image name
        id: image
        run: |
          owner_repo=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner_repo}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache lives in the Actions cache, so unchanged dependency
          # layers are not rebuilt on every push.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false
