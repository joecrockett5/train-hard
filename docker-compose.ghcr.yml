# Run the published images instead of building locally.
#
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
#
# IMAGE_REPO defaults to this project's own packages, so a clone needs no
# configuration to run the published build. Point it somewhere else to run
# your own fork's images:
#
#   IMAGE_REPO=ghcr.io/you/your-fork \
#     docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
#
# IMAGE_TAG picks which build, and which language:
#
#   japanese   the Japanese UI, tracking this branch  (the default)
#   latest     the English UI, tracking main
#   1.2.0-ja   a Japanese release
#   1.2.0      the same release, English
#   <sha>      exactly one build
#
# The default is `japanese`, not `latest`: this is the Japanese branch, and
# inheriting main's default would hand a checkout of it the English app.
#
# The two languages never share a tag, so a running stack cannot be switched
# from one to the other by an update.
#
# Nothing else changes -- DynamoDB, the table init and the volume are all
# still defined in docker-compose.yml.

services:
  dynamodb-init:
    image: ${IMAGE_REPO:-ghcr.io/joecrockett5/train-hard}/backend:${IMAGE_TAG:-japanese}
    build: !reset null
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  backend:
    image: ${IMAGE_REPO:-ghcr.io/joecrockett5/train-hard}/backend:${IMAGE_TAG:-japanese}
    build: !reset null
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  frontend:
    image: ${IMAGE_REPO:-ghcr.io/joecrockett5/train-hard}/frontend:${IMAGE_TAG:-japanese}
    build: !reset null
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # ---------------------------------------------------------------------------
  # Watches the tags above and redeploys when their digest changes, so a push
  # to main reaches the machine without anyone logging in.
  #
  # It only touches containers it is told to: `--label-enable` means a
  # container opts in with com.centurylinklabs.watchtower.enable, which the
  # three above do and DynamoDB deliberately does not -- an unattended
  # restart of the database is not something to volunteer for.
  #
  # Tags are moving targets. `latest` and `japanese` get a new digest on
  # every push to their branch; a version or a sha never changes, so pinning
  # one is how you opt out of updates while leaving this running.
  # ---------------------------------------------------------------------------
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: train-hard-watchtower
    restart: unless-stopped
    volumes:
      # Watchtower pulls and recreates containers, which is what this socket
      # is for. It is also full control of the Docker daemon, so this belongs
      # on a machine you own and not on a shared host.
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --cleanup --include-restarting
    environment:
      # Hourly: this is a personal app, and a tighter loop mostly spends
      # registry rate limit to find nothing.
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-3600}
      # Drop the old image after a successful pull, so the disk does not fill
      # with every version ever deployed.
      WATCHTOWER_CLEANUP: "true"
