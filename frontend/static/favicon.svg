<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
	<!--
		The tab icon. Heavier strokes and no dip in the line: at 16px the
		middle step of the full mark closes up into a smudge, so the favicon
		keeps the climb and drops the detail.
	-->
	<defs>
		<linearGradient id="thFaviconRamp" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#EF6C1A" />
			<stop offset="1" stop-color="#FBB724" />
		</linearGradient>
	</defs>
	<rect width="64" height="64" rx="14" fill="url(#thFaviconRamp)" />
	<path
		d="M14 46 L28 33 L46 16"
		fill="none"
		stroke="#14110F"
		stroke-width="9"
		stroke-linecap="round"
		stroke-linejoin="round"
	/>
	<circle cx="46" cy="16" r="7" fill="#14110F" />
</svg>
