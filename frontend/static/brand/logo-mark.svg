<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="train hard">
	<title>train hard</title>
	<!--
		The mark is the app's own graph: a line that climbs, with the latest
		reading marked on it. The ramp runs ember to amber left to right, so
		the climb gets hotter as it rises.
	-->
	<defs>
		<linearGradient id="thMarkRamp" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#EF6C1A" />
			<stop offset="1" stop-color="#FBB724" />
		</linearGradient>
	</defs>
	<rect width="64" height="64" rx="15" fill="url(#thMarkRamp)" />
	<path
		d="M12 46 L24 31 L34 40 L50 16"
		fill="none"
		stroke="#14110F"
		stroke-width="7"
		stroke-linecap="round"
		stroke-linejoin="round"
	/>
	<circle cx="50" cy="16" r="6" fill="#14110F" />
</svg>
