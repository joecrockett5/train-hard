<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="train hard">
	<title>train hard</title>
	<!--
		Full bleed, with the mark pulled into the middle 60% so that whatever
		shape the platform masks out of it -- circle, squircle, rounded square
		-- never clips the climb. Square corners on purpose: the OS supplies
		the rounding, and rounding it here too leaves four pale notches.
	-->
	<defs>
		<linearGradient id="thMaskableRamp" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#EF6C1A" />
			<stop offset="1" stop-color="#FBB724" />
		</linearGradient>
	</defs>
	<rect width="64" height="64" fill="url(#thMaskableRamp)" />
	<g transform="translate(32 32) scale(0.62) translate(-32 -32)">
		<path
			d="M12 46 L24 31 L34 40 L50 16"
			fill="none"
			stroke="#14110F"
			stroke-width="7"
			stroke-linecap="round"
			stroke-linejoin="round"
		/>
		<circle cx="50" cy="16" r="6" fill="#14110F" />
	</g>
</svg>
