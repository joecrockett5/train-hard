<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 64" width="236" height="64" role="img" aria-label="train hard">
	<title>train hard</title>
	<!--
		One colour, inherited. For a stencil, an embroidered strap, a dark
		press sheet, or anywhere the ramp cannot be reproduced: the mark keeps
		its silhouette because the climb is drawn, not implied by the colour.
	-->
	<rect
		x="1.75"
		y="1.75"
		width="60.5"
		height="60.5"
		rx="13.5"
		fill="none"
		stroke="currentColor"
		stroke-width="3.5"
	/>
	<path
		d="M13 45 L24.5 31.5 L34.5 40 L49 17"
		fill="none"
		stroke="currentColor"
		stroke-width="6.5"
		stroke-linecap="round"
		stroke-linejoin="round"
	/>
	<circle cx="49" cy="17" r="5.5" fill="currentColor" />
	<text
		x="80"
		y="42"
		font-family="'Inter Tight', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
		font-size="31"
		letter-spacing="-1"
		fill="currentColor"
	><tspan font-weight="500" opacity="0.62">train</tspan><tspan font-weight="800">hard</tspan></text>
</svg>
