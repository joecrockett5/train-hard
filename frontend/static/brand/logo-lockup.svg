<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 64" width="236" height="64" role="img" aria-label="train hard">
	<title>train hard</title>
	<defs>
		<linearGradient id="thLockupRamp" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#EF6C1A" />
			<stop offset="1" stop-color="#FBB724" />
		</linearGradient>
	</defs>
	<rect width="64" height="64" rx="15" fill="url(#thLockupRamp)" />
	<path
		d="M12 46 L24 31 L34 40 L50 16"
		fill="none"
		stroke="#14110F"
		stroke-width="7"
		stroke-linecap="round"
		stroke-linejoin="round"
	/>
	<circle cx="50" cy="16" r="6" fill="#14110F" />
	<!--
		Two weights of one face rather than two faces: "train" is the setup and
		"hard" is the point, so the contrast carries the emphasis and the
		lockup stays one word wide.
	-->
	<text
		x="80"
		y="42"
		font-family="'Inter Tight', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
		font-size="31"
		letter-spacing="-1"
		fill="currentColor"
	><tspan font-weight="500" opacity="0.62">train</tspan><tspan font-weight="800">hard</tspan></text>
</svg>
