<!doctype html>
<html lang="en" class="%theme%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<!--
			iOS uses this for "Add to Home Screen", not the manifest's icons,
			and it wants 180x180. The image is square and opaque on purpose:
			iOS applies its own rounded mask, and a transparent corner would
			be composited onto black.
		-->
		<!--
			`?v` is a cache buster, not decoration. iOS remembers what it got
			for an icon URL per origin, including having got nothing, and that
			memory survives clearing Safari's website data -- so a phone that
			once failed to fetch this keeps showing a blank Home Screen tile
			until the URL changes. Bump it if that happens again.
		-->
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/apple-touch-icon.png?v=2"
		/>
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#e4572e" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="hard" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
		%sveltekit.head%
		<script>
			var global = global || window;
			var Buffer = Buffer || [];
			var process = process || { env: { DEBUG: undefined }, version: [] };
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
